name: CI and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  NO_COLOR: 'true'
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --no-default-features --features mcp --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features --features mcp
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: cargo build --locked --no-default-features --features mcp --bin berserk-mcp
      - run: python scripts/test_mcp.py
      - run: python scripts/test_catalog_mcp.py
      - run: python scripts/test_codex.py
      - run: python scripts/test_desktop.py

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match Cargo.toml version'
          PY
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-0.21.14-ubuntu-22.04
      - run: command -v trunk || cargo install trunk --locked --version 0.21.14
      - run: trunk build --release --locked --dist dist-release
      - uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: ubuntu-22.04
            platform: ubuntu
            arch: x86_64
          - os: windows-2022
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cargo test --locked --no-default-features --features mcp
      - name: Install Ubuntu desktop dependencies
        if: matrix.platform == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev xvfb dbus-x11 xdg-desktop-portal
      - name: Build native application
        run: cargo build --release --locked --no-default-features --features desktop --bin berserk-mcp --bin berserk
      - name: Test and lint native client
        run: |
          cargo test --locked --no-default-features --features desktop
          cargo clippy --locked --no-default-features --features desktop --all-targets -- -D warnings
      - run: python scripts/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Test packaged service and offline assets
        shell: bash
        run: |
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            python scripts/test_release.py desktop/build/Berserk.app
          else
            python scripts/test_release.py release/Berserk-*-${{ matrix.platform }}-${{ matrix.arch }}/
          fi
      - name: Test native Ubuntu window
        if: matrix.platform == 'ubuntu'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get install -y ./release/*.deb
          xvfb-run -a dbus-run-session -- python scripts/test_native.py /opt/berserk/berserk
      - name: Test native macOS window
        if: matrix.platform == 'macos'
        run: python scripts/test_native.py desktop/build/Berserk.app/Contents/MacOS/Berserk
      # Hosted Windows runners have no physical GPU. Test with MSYS2 Mesa;
      # this driver is not included in the already-created release archive.
      - uses: msys2/setup-msys2@v2
        if: matrix.platform == 'windows'
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-mesa
      - name: Install test-only Windows software renderer
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cp /mingw64/bin/*.dll release/Berserk-*-windows-x86_64/
      - name: Test native Windows window
        if: matrix.platform == 'windows'
        shell: bash
        run: python scripts/test_native.py release/Berserk-*-windows-x86_64/berserk.exe
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.deb
            release/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, web, binaries]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          cat *.sha256 | tr -d '\r' > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.zip ./*.tar.gz ./*.deb SHA256SUMS \
            --verify-tag --title "Berserk ${RELEASE_TAG}" --notes-file ../docs/release-notes.md
