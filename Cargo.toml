[package]
name = "berserk-leptos"
version = "0.1.1"
edition = "2024"
default-run = "berserk-leptos"
license = "LGPL-3.0-only"
description = "Berserk card encyclopedia and deck builder, rewritten in Rust and Leptos"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard", "Storage", "Document", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "File", "FileList", "HtmlInputElement", "Location", "HashChangeEvent", "KeyboardEvent", "PointerEvent", "DomRect", "CssStyleDeclaration", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "History", "HtmlCanvasElement", "HtmlImageElement", "CanvasRenderingContext2d", "ImageData", "WebGlRenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlTexture", "WebGlUniformLocation", "MediaQueryList", "console"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[features]
mcp = ["dep:rmcp", "dep:tokio", "dep:axum", "dep:uuid", "dep:tower-http"]
desktop = ["mcp", "dep:wry", "dep:tao", "dep:rfd"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rmcp = { version = "3.5.1", features = ["transport-io", "schemars"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process", "io-util", "signal"], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
rfd = { version = "0.17", default-features = false, features = ["gtk3"], optional = true }

[[bin]]
name = "berserk-mcp"
path = "src/bin/berserk-mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "berserk"
path = "src/bin/berserk.rs"
required-features = ["desktop"]
